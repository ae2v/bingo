services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bingo
      POSTGRES_USER: bingo
      POSTGRES_PASSWORD: bingo
    ports:
      - "5432:5432"
    volumes:
      - bingo_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bingo"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  bingo_postgres:
